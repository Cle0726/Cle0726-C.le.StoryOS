[package]
name = "cle-storyos-desktop"
version = "1.0.0"
description = "C.le. StoryOS authoring desktop shell with isolated manuscript recovery"
authors = ["Cle0726"]
edition = "2021"

[lib]
name = "cle_storyos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
