name: Release StoryOS Desktop

on:
  push:
    branches:
      - release/v1.0.0-preview.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storyos-v1.0.0-preview.1-${{ github.event_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0-preview.1
  RELEASE_TITLE: StoryOS 1.0.0 Preview 1

jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref == 'release/v1.0.0-preview.1'
    name: package (${{ matrix.key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            key: windows-x64
            bundles: nsis
          - os: macos-14
            key: macos-arm64
            bundles: dmg
          - os: ubuntu-22.04
            key: linux-x64
            bundles: appimage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install StoryOS desktop sidecar dependencies
        run: python -m pip install -e ".[desktop]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native installer
        working-directory: desktop
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $bundle = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $bundle) { throw "NSIS installer not found" }
          Copy-Item $bundle.FullName "release-assets/StoryOS-1.0.0-Windows-x64-Setup.exe"

      - name: Collect macOS installer
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$bundle"
          arch="$(uname -m)"
          cp "$bundle" "release-assets/StoryOS-1.0.0-macOS-${arch}.dmg"

      - name: Collect Linux installer
        if: runner.os == 'Linux'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$bundle"
          arch="$(uname -m)"
          cp "$bundle" "release-assets/StoryOS-1.0.0-Linux-${arch}.AppImage"
          chmod +x "release-assets/StoryOS-1.0.0-Linux-${arch}.AppImage"

      - name: Upload packaged installer
        uses: actions/upload-artifact@v4
        with:
          name: storyos-${{ matrix.key }}
          path: desktop/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v1.0.0-preview.1'
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          pattern: storyos-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          StoryOS 1.0.0 Preview 1 is the first directly installable desktop preview.

          Included downloads:
          - Windows x64 NSIS installer (.exe)
          - macOS Apple Silicon disk image (.dmg)
          - Linux x64 AppImage
          - SHA256SUMS.txt for integrity verification

          Validation before packaging:
          - StoryOS Python tests: Ubuntu/Windows, Python 3.11 and 3.13
          - Desktop TypeScript/Vite build: Ubuntu/Windows
          - PyInstaller StoryOS workspace sidecar smoke test: Ubuntu/Windows
          - Rust/Tauri workspace bridge tests: Ubuntu/Windows
          - Release trust-boundary compilation: Ubuntu/Windows
          - Native installer packaging: Windows/macOS/Linux

          The desktop binaries are currently unsigned. Windows SmartScreen and macOS Gatekeeper may therefore show an unknown-publisher/developer warning on first launch. No code-signing certificate or Apple notarization is included in this preview.
          EOF

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi
